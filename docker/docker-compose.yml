version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dinner-roulette-web
    ports:
      - "5000:5000"
    volumes:
      # Mount backups directory to persist data on host
      # For Unraid: Container runs as nobody:users (99:100)
      # Create directory: mkdir -p /mnt/user/appdata/dinner-roulette/backups
      # Set permissions: chown -R nobody:users /mnt/user/appdata/dinner-roulette/backups
      - ./backups:/app/backups
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    restart: unless-stopped
    networks:
      - dinner-roulette

networks:
  dinner-roulette:
    driver: bridge
